name: quarterly refresh

on:
  schedule:
    - cron: "0 6 2 1,4,7,10 *"   # 06:00 UTC on the 2nd of Jan/Apr/Jul/Oct
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: pip install -r requirements.txt

      - name: run tests
        run: pytest -q

      - name: fetch latest data
        run: python scripts/fetch.py

      - name: grade any outstanding forecasts whose outcome now exists
        run: python scripts/grade.py

      - name: run eligibility + backtest + selection, seal a new forecast if eligible
        run: python scripts/build.py --code-version "${{ github.sha }}"

      - name: verify ledger integrity
        run: python scripts/verify.py

      - name: rebuild static site data
        run: python scripts/build_site_data.py

      - name: commit updated artifacts if anything changed
        run: |
          git config user.name "forecast-ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ site/data.json
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "quarterly refresh: fetch, grade, backtest, seal"
          git push
